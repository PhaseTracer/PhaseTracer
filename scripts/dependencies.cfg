# Pinned third-party sources for `install_dependencies.sh --local`.
# Sourced by bash: each dependency has <NAME>_VERSION, <NAME>_URL, <NAME>_FILE, <NAME>_SHA256 and <NAME>_DIR
# (the top-level directory inside the archive). Bump a version by updating all five lines together.

EIGEN_VERSION=3.4.0
EIGEN_URL=https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
EIGEN_FILE=eigen-3.4.0.tar.gz
EIGEN_SHA256=8586084f71f9bde545ee7fa6d00288b264a2b7ac3607b974e54d13e7162c1c72
EIGEN_DIR=eigen-3.4.0

NLOPT_VERSION=2.7.1
NLOPT_URL=https://github.com/stevengj/nlopt/archive/refs/tags/v2.7.1.tar.gz
NLOPT_FILE=nlopt-2.7.1.tar.gz
NLOPT_SHA256=db88232fa5cef0ff6e39943fc63ab6074208831dc0031cf1545f6ecd31ae2a1a
NLOPT_DIR=nlopt-2.7.1

GSL_VERSION=2.7.1
GSL_URL=https://ftp.gnu.org/gnu/gsl/gsl-2.7.1.tar.gz
GSL_FILE=gsl-2.7.1.tar.gz
GSL_SHA256=dcb0fbd43048832b757ff9942691a8dd70026d5da0ff85601e52687f6deeb34b
GSL_DIR=gsl-2.7.1

ALGLIB_VERSION=3.18.0
ALGLIB_URL=https://www.alglib.net/translator/re/alglib-3.18.0.cpp.gpl.tgz
ALGLIB_FILE=alglib-3.18.0.cpp.gpl.tgz
ALGLIB_SHA256=98ee704574321f10b25fdab64549c114c00df9629092b971cce9fedfd96ee829
ALGLIB_DIR=alglib-cpp

BOOST_VERSION=1.83.0
BOOST_URL=https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz
BOOST_FILE=boost_1_83_0.tar.gz
BOOST_SHA256=c0685b68dd44cc46574cce86c4e17c0f611b15e195be9848dfd0769a0a207628
BOOST_DIR=boost_1_83_0

# HydroGrav (cloned by `--hydrograv`, otherwise by cmake/FindHydroGrav.cmake at configure time).
# Keep the branch in sync with HydroGrav_GIT_BRANCH in cmake/FindHydroGrav.cmake.
HYDROGRAV_URL=https://github.com/Hydro-Grav/HydroGrav.git
HYDROGRAV_BRANCH=feature/nu_spline

# Order matters only for readability; none of these depend on each other.
LOCAL_DEPENDENCIES="eigen nlopt gsl alglib boost"
